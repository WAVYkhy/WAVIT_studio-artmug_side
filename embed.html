<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVIT Studio Side Menu Component</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    /* Nordic Glass-Cut Sharp Edge Tokens */
    :root {
      --nordic-bg: transparent;
      --nordic-surface: #FFFFFF;
      --nordic-surface-subtle: #F4F4F5;
      --nordic-border: #D4D4D8;
      --nordic-border-strong: #000000;

      --text-primary: #000000;
      --text-secondary: #3F3F46;
      --text-muted: #71717A;

      --accent-surface: #000000;
      --accent-text: #FFFFFF;

      --card-radius: 2px;
      --cell-radius: 2px;
      --pill-radius: 2px;

      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--nordic-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* 아트머그 우측 커스텀 메뉴 단독 레이아웃 */
    .artmug-side-menu-wrapper {
      width: 100%;
      max-width: 190px;
      margin: 0 auto;
      padding: 4px;
    }

    .artmug-side-menu {
      width: 100%;
      box-sizing: border-box;
      background: var(--nordic-surface) !important;
      border: 1px solid var(--nordic-border) !important;
      border-radius: var(--card-radius) !important;
      padding: 14px 10px !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08) !important;
      color: var(--text-primary) !important;
      font-family: var(--font-sans) !important;
      font-size: 12px !important;
      line-height: 1.4 !important;
    }

    /* 상단 읽기 진행률 프로그레스 바 */
    .wm-progress-wrapper {
      height: 2px;
      background: var(--nordic-surface-subtle);
      width: 100%;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .wm-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-surface);
      transition: width 0.1s linear;
    }

    /* 헤더 & 동적 실시간 상태 배지 */
    .wm-header {
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--nordic-border);
    }

    .wm-title {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    /* 툴팁 래퍼 */
    .wm-status-wrapper {
      position: relative;
      display: inline-block;
    }

    .wm-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: var(--pill-radius);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: all 0.2s ease;
      cursor: default;
    }

    .wm-status.is-online {
      background: #ECFDF5;
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #059669;
    }
    .wm-status.is-online .wm-status-sq {
      background-color: #10B981;
      box-shadow: 0 0 4px #10B981;
    }

    .wm-status.is-idle {
      background: #FFFBEB;
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #D97706;
    }
    .wm-status.is-idle .wm-status-sq {
      background-color: #F59E0B;
    }

    .wm-status.is-offline {
      background: #F4F4F5;
      border: 1px solid #D4D4D8;
      color: #71717A;
    }
    .wm-status.is-offline .wm-status-sq {
      background-color: #A1A1AA;
    }

    .wm-status-sq {
      width: 4px;
      height: 4px;
      border-radius: 1px;
    }

    /* AWAY / OFFLINE 호버 툴팁 스타일 */
    .wm-status-tooltip {
      position: absolute;
      top: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: #18181B;
      color: #FFFFFF;
      padding: 4px 8px;
      border-radius: var(--card-radius);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: -0.02em;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.15s ease;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .wm-status.is-idle:hover + .wm-status-tooltip,
    .wm-status.is-offline:hover + .wm-status-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(2px);
    }

    .wm-section-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin: 10px 0 6px 2px;
    }

    .wm-nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wm-nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      color: var(--text-secondary);
      background: var(--nordic-surface-subtle);
      border: 1px solid var(--nordic-border);
      border-radius: var(--cell-radius);
      transition: all 0.12s ease;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }

    .wm-nav-item button:hover {
      background: var(--accent-surface) !important;
      color: var(--accent-text) !important;
      border-color: var(--accent-surface) !important;
    }

    .wm-top-btn {
      width: 100%;
      margin-top: 10px;
      padding: 6px;
      background: transparent;
      border: 1px solid var(--nordic-border);
      border-radius: var(--cell-radius);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .wm-top-btn:hover {
      background: var(--nordic-surface-subtle);
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <aside class="artmug-side-menu-wrapper">
    <div class="artmug-side-menu">
      
      <!-- 상단 읽기 진행률 프로그레스 바 -->
      <div class="wm-progress-wrapper">
        <div class="wm-progress-bar" id="wmProgressBar"></div>
      </div>

      <!-- 브랜드 헤더 & 실시간 디스코드 상태 배지 & 호버 툴팁 -->
      <div class="wm-header">
        <div class="wm-title">WAVIT STUDIO</div>
        <div class="wm-status-wrapper">
          <div class="wm-status is-online" id="wmStatusBadge">
            <span class="wm-status-sq"></span>
            <span id="wmStatusText">ONLINE</span>
          </div>
          <div class="wm-status-tooltip">답변까지 다소 시간이 소요될 수 있습니다.</div>
        </div>
      </div>

      <!-- 빠른 이동 목차 (3개 항목) -->
      <div class="wm-section-label">Quick Navigation</div>
      <ul class="wm-nav-list">
        <li class="wm-nav-item">
          <button type="button" onclick="wmScrollTo('sec-schedule')">
            <span>작업 일정</span>
            <span class="wm-nav-arrow">&rarr;</span>
          </button>
        </li>
        <li class="wm-nav-item">
          <button type="button" onclick="wmScrollTo('sec-portfolio')">
            <span>포트폴리오</span>
            <span class="wm-nav-arrow">&rarr;</span>
          </button>
        </li>
        <li class="wm-nav-item">
          <button type="button" onclick="wmScrollTo('sec-quote')">
            <span>견적 계산기</span>
            <span class="wm-nav-arrow">&rarr;</span>
          </button>
        </li>
      </ul>

      <!-- 맨 위로 이동 -->
      <button type="button" class="wm-top-btn" onclick="wmScrollToTop()">TOP</button>
    </div>
  </aside>

  <script>
    // 부모 창(아트머그 페이지)으로 스크롤 이동 요청 메시지 전송
    function wmScrollTo(targetId) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'scrollTo', targetId: targetId }, '*');
        }
      } catch (e) {}
    }

    function wmScrollToTop() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'scrollToTop' }, '*');
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (e) {}
    }

    // 디스코드 실시간 온라인 상태 불러오기 (Lanyard API)
    (function() {
      const DISCORD_USER_ID = "680023951157624875";

      function updateOnlineStatus(statusType) {
        const badge = document.getElementById('wmStatusBadge');
        const text = document.getElementById('wmStatusText');
        if (!badge || !text) return;
        
        badge.className = 'wm-status';
        if (statusType === 'online') {
          badge.classList.add('is-online');
          text.textContent = 'ONLINE';
        } else if (statusType === 'idle' || statusType === 'dnd') {
          badge.classList.add('is-idle');
          text.textContent = 'AWAY';
        } else {
          badge.classList.add('is-offline');
          text.textContent = 'OFFLINE';
        }
      }

      if (DISCORD_USER_ID) {
        fetch('https://api.lanyard.rest/v1/users/' + DISCORD_USER_ID)
          .then(res => res.json())
          .then(data => {
            if (data && data.success && data.data) {
              updateOnlineStatus(data.data.discord_status);
            }
          })
          .catch(() => updateOnlineStatus('online'));
      }
    })();
  </script>
</body>
</html>
